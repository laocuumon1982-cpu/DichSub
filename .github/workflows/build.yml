name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Đọc số phiên bản, xem đã phát hành chưa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = (Select-String -Path dich_viet.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "VER=v$v" >> $env:GITHUB_ENV
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          # Đẩy lên main mà số phiên bản chưa có bản phát hành -> build và phát hành. Đã có -> bỏ qua.
          $release = (-not $exists) -and ("${{ github.event_name }}" -eq "push")
          $skip = $exists -and ("${{ github.event_name }}" -eq "push")
          "RELEASE=$release" >> $env:GITHUB_ENV
          "SKIP=$skip" >> $env:GITHUB_ENV
          Write-Host "Phiên bản v$v, đã phát hành: $exists, phát hành lần này: $release"

      - name: Cài thư viện
        if: env.SKIP != 'True'
        run: python -m pip install -U pyinstaller ctranslate2 sentencepiece pypdf reportlab pillow faster-whisper opencc-python-reimplemented rapidocr

      - name: Build exe 1 file và bản portable
        if: env.SKIP != 'True'
        shell: pwsh
        run: |
          python build_ui.py
          $env:DICHVIET_MODE = "onefile"
          python -m PyInstaller --noconfirm --distpath out/onefile --workpath out/w1 DichViet.spec
          $env:DICHVIET_MODE = "onedir"
          python -m PyInstaller --noconfirm --distpath out/portable --workpath out/w2 DichViet.spec
          $p = "out/portable/DichSub"
          Set-Content -Path "$p/portable.ini" -Value "[DichSub]`r`n; Ban portable: cau hinh, tai lieu, model HachimiMT, Whisper, OCR va thu vien GPU luu trong thu muc data ben canh."
          New-Item -ItemType Directory -Force "$p/data" | Out-Null
          Set-Content -Path "$p/data/README.txt" -Value "Du lieu cua ban portable (cau hinh, tai lieu, model). Khong xoa thu muc nay khi cap nhat."
          Copy-Item HUONG_DAN.txt $p
          Rename-Item $p "DichSub Portable"
          Compress-Archive -Path "out/portable/DichSub Portable" -DestinationPath "out/DichSub-Portable.zip"
          Copy-Item "out/onefile/DichSub.exe" "out/DichSub.exe"
          Get-ChildItem out/*.exe, out/*.zip | Format-Table Name, Length

      - name: Thử chạy bản exe
        if: env.SKIP != 'True'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out/DichSub.exe" -ArgumentList "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:47863/api/stt/info; $ok = $true; break } catch {}
          }
          if ($ok) {
            $o = Invoke-RestMethod http://127.0.0.1:47863/api/ocr/info
            # HachimiMT: tiến trình phụ phải nạp được ctranslate2 + sentencepiece (bắt lỗi thiếu DLL)
            $h = $null
            for ($i = 0; $i -lt 45; $i++) {
              $h = Invoke-RestMethod http://127.0.0.1:47863/api/hachimi
              if ($h.probe.state -eq "done") { break }
              Start-Sleep 2
            }
            Write-Host "HachimiMT probe: state=$($h.probe.state) cuda=$($h.probe.cuda) err=$($h.probe.err)"
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe không chạy được" }
          $r.libs | Format-List
          $o.libs | Format-List
          if (-not ($r.libs.faster_whisper -and $r.libs.av -and $r.libs.ctranslate2)) { throw "thiếu thư viện Whisper trong exe" }
          if (-not ($o.libs.rapidocr -and $o.libs.cv2 -and $o.libs.onnxruntime)) { throw "thiếu thư viện quét chữ trong exe" }
          if ($h.probe.state -ne "done") { throw "HachimiMT không khởi động được trong exe" }
          if ($h.probe.err -match "ImportError|DLL load|No module") { throw "HachimiMT lỗi thư viện trong exe: $($h.probe.err)" }

      - name: Lưu file build
        if: env.SKIP != 'True' && env.RELEASE != 'True'
        uses: actions/upload-artifact@v4
        with:
          name: DichSub-windows
          path: |
            out/DichSub.exe
            out/DichSub-Portable.zip

      - name: Đăng bản phát hành
        if: env.RELEASE == 'True'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:VER" out/DichSub.exe out/DichSub-Portable.zip `
            --target "${{ github.sha }}" --title "Dịch Sub & Book $env:VER" --notes-file RELEASE_NOTES.md
